name: Validate FnDepot index

on:
  push:
    paths:
      - fnpack.json
      - "*/ICON.PNG"
      - "*/README.md"
      - scripts/validate-fnpack.mjs
      - .github/workflows/validate.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Validate fnpack.json
        run: node scripts/validate-fnpack.mjs